# Exigences de l'outillage de traçabilité lui-même (plan M0).
- id: TOOL.TRACE.01
  title: "#[covers] sans effet sur l'élément annoté"
  description: L'attribut relie une fonction à des exigences sans modifier son comportement.
  domain: TRANS
  lot: MVP
  acceptance:
    - Un test annoté s'exécute normalement.
    - Une fonction annotée renvoie la même valeur que sans l'attribut.
  levels: [unit]
