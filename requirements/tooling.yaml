  lot: MVP
  acceptance:
    - "#[covers()] produit « au moins un identifiant »."
    - "#[covers(\"ts.tr1.01\")] et #[covers(\"TS.TR1\")] produisent « identifiant d'exigence invalide »."
  levels: [unit]
  source: plan M0, Tâche 2
