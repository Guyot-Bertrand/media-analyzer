# F17 — Rapport, journaux et export (lot MVP)

- id: RPT.TABLE.01
  title: Colonnes du rapport
  description: Le rapport liste les messages avec Type (icône et couleur), Famille, Sous-famille, Image, Position (octet) et Description traduite.
  domain: F17
  lot: MVP
  acceptance:
    - Les 12 messages du TS de référence apparaissent avec ces six colonnes renseignées (Image et Position « — » pour les messages globaux).
  levels: [unit, ui]
  source: 01 §F17 ; 03 §4.9 ; maquette Report.dc.html
  status: draft

- id: RPT.FILTER.01
  title: Filtres, recherche et compteurs
  description: Filtres par type, famille et sous-famille ; recherche dans les descriptions ; compteurs erreurs / avertissements / infos cliquables qui filtrent.
  domain: F17
  lot: MVP
  acceptance:
    - Cliquer le compteur « 3 erreurs » ne laisse que les 3 erreurs.
    - Rechercher « PCR » ne laisse que les messages dont la description contient PCR.
  levels: [ui]
  source: 03 §4.9
  status: draft

- id: RPT.GROUP.01
  title: Regroupement des messages répétés
  description: Les messages identiques (même règle, même PID) sont regroupés en une ligne dépliable avec leur nombre.
  domain: F17
  lot: MVP
  acceptance:
    - Les 3 erreurs de continuity counter sur 0x0101 forment un groupe « × 3 » qui se déplie en 3 lignes.
    - Le regroupement peut être désactivé.
  levels: [unit, ui]
  source: 03 §4.9 ; maquette Report.dc.html
  status: draft

- id: RPT.MUTE.01
  title: Mise en sourdine après N occurrences
  description: Au-delà de N occurrences d'un même type de message (paramétrable), les suivantes ne sont plus enregistrées individuellement mais comptées.
  domain: F17
  lot: MVP
  acceptance:
    - Avec N = 100, un flux produisant 10 000 erreurs 1.4 enregistre 100 messages et un compteur total de 10 000.
  levels: [unit]
  source: 01 §F17, §F18 (Log Settings)
  status: draft

- id: RPT.NAV.01
  title: Navigation depuis un message
  description: Un double-clic sur un message amène à l'image concernée et sélectionne, si possible, l'élément de syntaxe ou l'indicateur associé.
  domain: F17
  lot: MVP
  acceptance:
    - Double-cliquer l'erreur 1.4 à l'image 29 561 rend cette image courante dans toutes les vues.
  levels: [ui, e2e]
  source: 03 §3 (synchronisation), §4.9
  status: draft

- id: RPT.SCALE.01
  title: Rapport de plusieurs millions de messages
  description: Les messages sont stockés hors mémoire et paginés ; le défilement reste fluide.
  domain: F17
  lot: MVP
  acceptance:
    - Avec 5 millions de messages, l'ouverture du rapport et un défilement jusqu'à la fin prennent moins de 1 s chacun, et la mémoire du processus moteur augmente de moins de 200 Mo.
  levels: [unit, ui]
  source: 02 §3.6
  status: draft

- id: RPT.EXPORT.01
  title: Export CSV et texte
  description: Le rapport (avec filtres appliqués) et le contenu de la vue courante s'exportent en CSV (format machine stable — point décimal, dates ISO 8601, UTF-8) et en texte lisible.
  domain: F17
  lot: MVP
  acceptance:
    - L'export CSV du rapport filtré contient une ligne par message et des nombres au point décimal, quelle que soit la langue de l'interface.
    - L'export texte est lisible et suit la langue de l'interface.
  levels: [unit, ui]
  source: 01 §F17 ; 02 §4.3 (formats)
  status: draft

- id: RPT.LOG.01
  title: Journaux persistants
  description: Les messages d'une analyse sont conservés avec l'index du fichier ; à la réouverture, le rapport est disponible sans réanalyse.
  domain: F17
  lot: MVP
  acceptance:
    - Rouvrir un fichier déjà analysé affiche le même rapport sans relancer TR 101 290.
  levels: [unit]
  source: 01 §F17 ; 02 §3.1, §3.6
  status: draft
