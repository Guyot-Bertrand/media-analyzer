<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banc du transport d'image</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #view { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; }
      #status { position: fixed; left: 8px; bottom: 8px; padding: 2px 6px; font: 13px monospace; color: #ddd; background: rgba(0, 0, 0, 0.6); }
    </style>
  </head>
  <body>
    <canvas id="view" width="1920" height="1080"></canvas>
    <div id="status">aucun fichier</div>
    <script>
      // Erreurs de chargement du module (avant que main.ts ne prenne le relais).
      window.addEventListener("error", (e) => {
        document.getElementById("status").textContent = `erreur : ${e.message}`;
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
