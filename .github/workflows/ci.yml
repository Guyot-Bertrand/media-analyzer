name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu 24.04 — cargo xtask ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (BUILD.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config clang libclang-dev mold \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            libswresample-dev libva-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny
      - run: cargo xtask ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrice-de-tracabilite
          path: target/trace/

  fedora:
    name: Fedora — construction et tests
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Dépendances système (BUILD.md)
        run: |
          dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
          dnf install -y gcc gcc-c++ curl wget file pkgconf-pkg-config clang clang-devel mold git tar \
            webkit2gtk4.1-devel gtk3-devel libsoup3-devel javascriptcoregtk4.1-devel \
            libxdo-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel ffmpeg-devel libva-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build --workspace
      - run: cargo nextest run --workspace
