name: Build

# Construction seule, sans tests (ils se lancent en local : `cargo xtask ci`).
# Déclenchée uniquement par un tag de version posé sur un commit de main.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  tag-on-main:
    name: Tag posé sur main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Le commit du tag appartient à main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) est sur main"
          else
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) n'est pas sur main : construction refusée"
            exit 1
          fi

  ubuntu:
    name: Ubuntu 24.04 — construction
    needs: tag-on-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (BUILD.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config clang libclang-dev mold \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            libswresample-dev libva-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Feature FFmpeg selon libavcodec (comme cargo xtask ci)
        run: |
          major=$(pkg-config --modversion libavcodec | cut -d. -f1)
          case "$major" in
            60) f=ffmpeg6 ;;
            61) f=ffmpeg7 ;;
            62) f=ffmpeg8 ;;
            *) echo "libavcodec $major non prise en charge (60, 61 ou 62 attendue)"; exit 1 ;;
          esac
          echo "libavcodec $(pkg-config --modversion libavcodec) => $f"
          echo "FFMPEG_FEATURE=ma-ffmpeg/$f" >> "$GITHUB_ENV"
      - run: cargo build --workspace --release --locked --features "$FFMPEG_FEATURE"

  fedora:
    name: Fedora — construction
    needs: tag-on-main
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Dépendances système (BUILD.md)
        run: |
          dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
          # --allowerasing : les paquets RPM Fusion remplacent ffmpeg-free s'il est présent.
          dnf install -y --allowerasing gcc gcc-c++ curl wget file pkgconf-pkg-config clang clang-devel mold git tar \
            webkit2gtk4.1-devel gtk3-devel libsoup3-devel javascriptcoregtk4.1-devel \
            libxdo-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel ffmpeg-devel libva-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Feature FFmpeg selon libavcodec (comme cargo xtask ci)
        run: |
          major=$(pkg-config --modversion libavcodec | cut -d. -f1)
          case "$major" in
            60) f=ffmpeg6 ;;
            61) f=ffmpeg7 ;;
            62) f=ffmpeg8 ;;
            *) echo "libavcodec $major non prise en charge (60, 61 ou 62 attendue)"; exit 1 ;;
          esac
          echo "libavcodec $(pkg-config --modversion libavcodec) => $f"
          echo "FFMPEG_FEATURE=ma-ffmpeg/$f" >> "$GITHUB_ENV"
      - run: cargo build --workspace --release --locked --features "$FFMPEG_FEATURE"
