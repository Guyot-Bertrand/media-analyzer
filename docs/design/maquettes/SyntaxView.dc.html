<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">

body{margin:0}

<div style="position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: {{t.bg1}}; color: {{t.tx}}; font-family: IBM Plex Sans, system-ui, sans-serif; font-size: 12px; line-height: 16px">
  <div role="toolbar" aria-label="{{s.toolbar}}" style="min-height: 36px; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 4px 10px; border-bottom: 1px solid {{t.line}}">
    <div role="radiogroup" aria-label="{{s.base}}" title="{{s.baseTip}}" style="display: flex; padding: 2px; gap: 2px; border: 1px solid {{t.line}}; border-radius: 6px">
      <sc-for list="{{bases}}" as="b" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="height: 22px; padding: 0 9px; border: 0; border-radius: 4px; background: {{b.bg}}; color: {{b.color}}; font: inherit; font-size: 11px; cursor: pointer">{{b.label}}</button>
      </sc-for>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; height: 26px; width: 260px; box-sizing: border-box; padding: 0 8px; border: 1px solid {{t.line2}}; border-radius: 5px; background: {{t.field}}; color: {{t.tx3}}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
      <input type="search" value="pic_order" aria-label="{{s.search}}" title="{{s.searchTip}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{t.tx}}; font-family: IBM Plex Mono, monospace; font-size: 11.5px">
      <span style="font-size: 11px; white-space: nowrap">1 / 3</span>
    </label>
    <sc-for list="{{tools}}" as="b" hint-placeholder-count="4">
      <button title="{{b.tip}}" aria-pressed="{{b.on}}" onClick="{{b.click}}" style="height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 1px solid {{b.border}}; border-radius: 5px; background: {{b.bg}}; color: {{b.color}}; font: inherit; cursor: pointer; white-space: nowrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>{{b.label}}
      </button>
    </sc-for>
    <div style="flex: 1"></div>
    <span style="color: {{t.tx3}}; font-size: 11px; white-space: nowrap">{{s.legend}}</span>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; gap: 1px; background: {{t.line}}">
    <sc-for list="{{panes}}" as="p" hint-placeholder-count="2">

        <div style="height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: {{t.bg2}}; border-bottom: 1px solid {{t.line}}">
          <span style="font-weight: 600">{{p.title}}</span>
          <span style="color: {{t.tx3}}; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.sub}}</span>
        </div>
        <div role="row" style="height: 22px; flex: none; display: flex; align-items: center; padding: 0 10px; border-bottom: 1px solid {{t.line}}; color: {{t.tx3}}; font-size: 11px">
          <span role="columnheader" style="flex: 1; min-width: 0">{{s.cEl}}</span>
          <span role="columnheader" style="width: 84px; text-align: right; padding-right: 10px">{{s.cVal}}</span>
          <span role="columnheader" title="{{s.cLenTip}}" style="width: 52px; text-align: right; padding-right: 10px">{{s.cLen}}</span>
          <span role="columnheader" title="{{s.cOffTip}}" style="width: 58px; text-align: right; padding-right: 12px">{{s.cOff}}</span>
          <span role="columnheader" style="width: {{interpW}}px">{{s.cInt}}</span>
        </div>
        <div role="treegrid" aria-label="{{p.title}}" style="flex: 1; min-height: 0; overflow: auto">
          <sc-for list="{{p.rows}}" as="r" hint-placeholder-count="14">
            <button role="row" title="{{r.tip}}" onClick="{{r.pick}}" style="width: 100%; height: 21px; display: flex; align-items: center; padding: 0 10px; border: 0; border-left: 2px solid {{r.bar}}; background: {{r.bg}}; color: {{r.color}}; font: inherit; font-family: IBM Plex Mono, monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; text-align: left; cursor: default">
              <span role="gridcell" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding-left: {{r.indent}}px; white-space: nowrap; overflow: hidden">
                <span aria-hidden="true" style="width: 10px; flex: none; color: {{t.tx3}}"><sc-if value="{{r.node}}" hint-placeholder-val="{{ false }}"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.caret}}"></path></svg></sc-if></span>
                <span style="overflow: hidden; text-overflow: ellipsis; font-weight: {{r.weight}}; font-family: {{r.font}}">{{r.el}}</span>
              </span>
              <span role="gridcell" style="width: 84px; text-align: right; padding-right: 10px; white-space: nowrap; overflow: hidden; color: {{r.valColor}}">{{r.val}}</span>
              <span role="gridcell" style="width: 52px; text-align: right; padding-right: 10px; color: {{t.tx3}}">{{r.len}}</span>
              <span role="gridcell" style="width: 58px; text-align: right; padding-right: 12px; color: {{t.tx3}}">{{r.off}}</span>
              <span role="gridcell" style="width: {{interpW}}px; display: flex; align-items: center; gap: 6px; font-family: IBM Plex Sans, system-ui, sans-serif; font-size: 12px; white-space: nowrap; overflow: hidden">
                <sc-if value="{{r.hasLed}}" hint-placeholder-val="{{ false }}"><dc-import name="Led" state="{{r.st}}" theme="{{theme}}" size="11" hint-size="11px,11px"></dc-import></sc-if>
                <span style="overflow: hidden; text-overflow: ellipsis; color: {{r.intColor}}">{{r.interp}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <sc-if value="{{showHex}}" hint-placeholder-val="{{ true }}">
    <section aria-label="{{s.hex}}" style="height: {{hexH}}px; flex: none; display: flex; flex-direction: column; border-top: 1px solid {{t.line}}; background: {{t.bg2}}">
      <div style="height: 24px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid {{t.line}}; font-size: 11px; color: {{t.tx3}}">
        <span style="font-weight: 600; color: {{t.tx2}}">{{s.hex}}</span>
        <span>{{s.hexSel}}</span>
      </div>
      <div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 12px; font-family: IBM Plex Mono, monospace; font-size: 11.5px; line-height: 18px; font-variant-numeric: tabular-nums">

          <div style="display: flex; gap: 16px; white-space: nowrap">
            <span style="width: 72px; color: {{t.tx3}}">{{h.off}}</span>
            <span style="display: flex; gap: 0">
              <sc-for list="{{h.bytes}}" as="b" hint-placeholder-count="16">
                <span style="width: 22px; margin-right: {{b.gap}}px; text-align: center; border-radius: 2px; background: {{b.bg}}; color: {{b.color}}">{{b.v}}</span>
              </sc-for>
            </span>
            <span style="color: {{t.tx3}}; letter-spacing: 0.04em">{{h.ascii}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>

const HEX=[[0x80,'6B 1C 80 00 00 00 01 4E 01 90 04 03 E8 01 90 80'],[0x90,'00 00 00 01 2A 01 AF 13 89 5C 7B 52 E0 9D 3F 0A'],[0xA0,'61 C2 88 F4 17 5B E0 23 9C 46 D1 0B 7A 58 E2 91']];
const nf=(n,l)=>typeof n==='number'?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,l==='en'?',':' '):n;
class Component extends DCLogic {
  renderVals() {
