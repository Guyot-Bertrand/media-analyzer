[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` (macros, à la compilation seulement) est archivé ; il n'est tiré que par rsmpeg, la
  # liaison FFmpeg retenue (docs/04-resultats-spike.md §3.1). Avis « non maintenu », pas une faille.
  # À retirer quand rsmpeg passera à un remplaçant (pastey…).
  { id = "RUSTSEC-2024-0436", reason = "paste, macro de compilation tirée par rsmpeg ; non maintenu, sans faille connue" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "LGPL-2.1-or-later", "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
