# Flux de référence de la structure (STRUCT.TREE.*) : HEVC Main 10 (PID 0x100), AAC (0x101), E-AC-3 (0x102),
# `-streamid`, `-muxrate 6M` (paquets nuls disponibles : débit vidéo 800 kb/s, VBV de 100 kbit, pour que l'image I
# ne crée jamais plus de 99 paquets consécutifs sans paquet nul, soit 25 ms), service « MA Référence » / « Media Analyzer ».
# `xtask` réécrit ensuite la PMT (ajoute 0x103 sous-titres et 0x1F4 SCTE-35 CUEI) et remplace des paquets nuls
# par une section SCTE-35 `splice_null` par seconde sur 0x1F4.
[[file]]
name = "ts_ref"
file = "ts_ref.ts"
codec = "hevc"
profile = "Main 10"
size = "1280x720"
fps = 50
frames = 100
gop = 50
bframes = 3
code_bits = 16
code_modulo = 65536
features = ["closed_gop", "ref_mux"]
big = false
bitrate = "800k"

# Dérivé de ts_ref : PCR_PID = 0x1FF et paquets PCR seuls (champ d'adaptation seul) sur 0x1FF. Ils remplacent
# des paquets nuls situés entre le premier et le dernier PCR vidéo, choisis gloutonnement : au plus 100 paquets
# (25 ms à 6 Mb/s, donc ≤ 30 ms) après le précédent, le plus tard possible. Valeur du PCR interpolée linéairement
# (en position de paquet) entre les deux PCR vidéo qui encadrent le paquet. Les PCR de la vidéo restent.
[[file]]
name = "ts_pcr_pid"
file = "ts_pcr_pid.ts"
codec = "hevc"
profile = "Main 10"
size = "1280x720"
fps = 50
frames = 100
gop = 50
bframes = 3
code_bits = 16
code_modulo = 65536
features = ["closed_gop", "lone_pcr"]
big = false
derived_from = "ts_ref"

# Dérivé de ts_ref : la PMT ajoute 0x104 (0xEA, VC-1) et 0x105 (0x06 + descripteur d'extension AC-4), flux non analysés.
[[file]]
