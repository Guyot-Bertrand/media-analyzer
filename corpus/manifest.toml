frames = 201
gop = 50
bframes = 3
code_bits = 16
code_modulo = 65536
features = ["open_gop", "cra", "rasl", "starts_at_cra"]
big = false
derived_from = "hevc_720p_open_gop"

# Encodé en 1920x1088 puis `-bsf:v h264_metadata=crop_top=8:crop_bottom=0` : le SPS porte un rognage en
# haut de 8 lignes, l'image affichée fait 1920x1080 (`size`). Le numéro incrusté est dans la bande du
# haut de l'image encodée (1088/24 lignes), donc partiellement rognée : la ligne affichée la plus
# haute en fait toujours partie.
[[file]]
